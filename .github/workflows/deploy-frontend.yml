name: Deploy static frontend preview to GitHub Pages

on:
  push:
    branches: [webserver-prototype]
    paths:
      - 'webserver/frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout webserver-prototype
        uses: actions/checkout@v4
        with:
          ref: webserver-prototype

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webserver/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: webserver/frontend
        run: npm ci

      - name: Build static preview
        working-directory: webserver/frontend
        run: npm run build
        env:
          VITE_STATIC_PREVIEW: false
          VITE_API_BASE_URL: https://agvarpred.onrender.com

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webserver/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
