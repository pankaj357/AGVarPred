name: Webserver prototype

on:
  push:
    branches: [webserver-prototype]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install AGVarPred and API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install -r webserver/requirements.txt
      - name: Test webserver validation and model metadata
        run: pytest webserver/tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webserver/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm install
      - name: Build React interface
        run: npm run build
